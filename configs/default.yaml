resize:
  max_long_edge: 1600

preprocess:
  gaussian_blur: true
  gaussian_kernel: 5
  equalize_hist: false

feature:
  name: orb
  orb:
    nfeatures: 3000
    scaleFactor: 1.2
    nlevels: 8
    edgeThreshold: 31
    firstLevel: 0
    WTA_K: 2
    scoreType: HARRIS_SCORE
    patchSize: 31
    fastThreshold: 20

matching:
  matcher: bf
  norm: hamming
  knn_k: 2
  ratio: 0.7
  min_good_matches: 30
  symmetry_check: true
  fallback_cross_check: true
  pairwise_grid_rows: 2
  pairwise_grid_cols: 3
  pairwise_min_occupied_cells: 3

homography:
  method: ransac
  fallback_affine_partial: true
  capture_direction: ""
  ransac_thresh: 5.0
  min_inliers: 20
  min_inlier_ratio: 0.55
  affine_min_inliers: 20
  affine_min_inlier_ratio: 0.28
  pairwise_max_canvas_width: 4000
  pairwise_max_canvas_height: 2500
  pairwise_max_canvas_pixels: 8000000
  pairwise_max_vertical_shift: 500
  pairwise_max_center_shift_ratio_x: 0.6
  pairwise_max_center_shift_ratio_y: 0.2
  max_canvas_width: 12000
  max_canvas_height: 6000
  max_canvas_pixels: 30000000

blend:
  mode: feather
  feather_blur_kernel: 61

debug:
  save_keypoints: true
  save_matches: true

dataset_overrides:
  base:
    homography:
      capture_direction: right_to_left
  l1:
    homography:
      capture_direction: left_to_right
  l2:
    homography:
      capture_direction: left_to_right
      pairwise_model_preference: affine_first
